name: Validate lab platform

on:
  push:
    branches: [main]
    paths:
      - 'labs/platform/**'
      - '.github/workflows/lab-smoke.yml'
  pull_request:
    paths:
      - 'labs/platform/**'
      - '.github/workflows/lab-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax check
        run: python -m py_compile labs/platform/umbramarket/app.py

      - name: Validate compose
        run: docker compose -f labs/platform/docker-compose.yml config

      - name: Start deterministic lab services
        run: docker compose -f labs/platform/docker-compose.yml up -d --build umbramarket admin files

      - name: Wait for services
        shell: bash
        run: |
          set -euo pipefail
          wait_url() {
            local url="$1"
            for _ in {1..30}; do
              if curl -fsS "$url" >/dev/null; then return 0; fi
              sleep 1
            done
            echo "Service not ready: $url" >&2
            return 1
          }
          wait_url http://127.0.0.1:5005/api/health
          wait_url http://127.0.0.1:8080
          wait_url http://127.0.0.1:9090

      - name: Verify guided lab behaviours
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:5005/api/health | grep -q 'umbramarket-guided'

          curl -sS -c /tmp/umbra.cookies \
            -d 'username=alice&password=Alice123!' \
            http://127.0.0.1:5005/login >/dev/null

          curl -fsS -b /tmp/umbra.cookies \
            http://127.0.0.1:5005/api/orders/1002 | grep -q 'Terni Chair'

          curl -fsS -G --data-urlencode "q='" \
            http://127.0.0.1:5005/search | grep -q 'Database error'

          curl -fsS -G --data-urlencode 'name=<b>student</b>' \
            http://127.0.0.1:5005/greet | grep -q '<b>student</b>'

          curl -fsS http://127.0.0.1:8080/robots.txt | grep -q '/backup/'
          curl -fsS http://127.0.0.1:9090/ | grep -q 'public-catalog.csv'

      - name: Show logs on failure
        if: failure()
        run: docker compose -f labs/platform/docker-compose.yml logs

      - name: Cleanup
        if: always()
        run: docker compose -f labs/platform/docker-compose.yml down -v
