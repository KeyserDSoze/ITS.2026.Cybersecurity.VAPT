name: Build premium PowerPoint decks

on:
  push:
    branches: [main]
    paths:
      - 'presentations/generate_premium_decks.py'
      - '.github/workflows/presentations.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-presentations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install python-pptx

      - name: Generate PowerPoint decks
        run: python presentations/generate_premium_decks.py

      - name: Commit generated decks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentations/premium/*.pptx
          if git diff --cached --quiet; then
            echo "No presentation changes to commit"
          else
            git commit -m "Generate premium course presentations [skip ci]"
            git push
          fi
